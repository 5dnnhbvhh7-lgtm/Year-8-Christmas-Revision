<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 8 D&amp;T Christmas Exam Revision Guide</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#1d2a26;--mu:#5d6d67;--pr:#0f8a6a;--prd:#0a6a52;--prl:#d9f2ea;--ok:#1a7f37;--okb:#dcf5e3;--no:#c62828;--nob:#fde4e4;--wn:#a15c00;--wnb:#fff1d6;--bd:#d8e1dd;--hd:#0c3b30}
@media (prefers-color-scheme:dark){:root{--bg:#0f1714;--card:#18231f;--tx:#e6efeb;--mu:#9bb0a8;--pr:#38c59d;--prd:#5fe0ba;--prl:#16342b;--ok:#5fd17f;--okb:#17331f;--no:#ff7b7b;--nob:#3b1a1a;--wn:#ffc266;--wnb:#3a2c10;--bd:#2a3b35;--hd:#07110e;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hd);color:#fff;padding:14px 16px 12px}
.hw,main{max-width:900px;margin:0 auto}
header h1{font-size:1.25rem;margin:0 0 8px}
.hrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hbar{flex:1;min-width:180px}
.pb{height:12px;background:#ffffff30;border-radius:8px;overflow:hidden}
.pb i{display:block;height:100%;background:#38c59d;border-radius:8px;transition:width .4s}
.stat{display:flex;gap:10px;font-size:.85rem}
.stat b{display:block;font-size:1.05rem}
.stat div{background:#ffffff18;border-radius:10px;padding:4px 10px;text-align:center}
nav{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav .hw{display:flex;overflow-x:auto;scrollbar-width:thin}
nav button{flex:0 0 auto;border:0;background:none;color:var(--tx);padding:10px 14px 8px;font:inherit;font-size:.9rem;cursor:pointer;border-bottom:4px solid transparent;text-align:center;min-width:104px}
nav button.on{border-bottom-color:var(--pr);font-weight:700;color:var(--prd)}
nav button small{display:block;height:5px;background:var(--bd);border-radius:4px;margin-top:5px;overflow:hidden}
nav button small i{display:block;height:100%;background:var(--pr)}
main{padding:14px 14px 60px}
h2{font-size:1.35rem;margin:6px 0 10px}h3{font-size:1.05rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 2px #0001}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--prl);color:var(--prd);padding:2px 10px;border-radius:20px;margin-bottom:6px}
.badge.act{background:#ffe9b8;color:#7a4b00}
@media (prefers-color-scheme:dark){.badge.act{background:#4a3710;color:#ffd58a}}
.done{float:right;font-size:.8rem;font-weight:700;color:var(--ok)}
.mu,.hint{color:var(--mu);font-size:.9rem}
button.b{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px}
button.b.p{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
button.b:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.q{border-top:1px solid var(--bd);padding:12px 0}.q:first-child{border-top:0}
.qt{margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pr)}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.fb{margin:8px 0 0;padding:9px 12px;border-radius:10px;display:none}
.fb.ok{display:block;background:var(--okb);color:var(--ok)}.fb.no{display:block;background:var(--nob);color:var(--no)}
.sum{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--prl);font-weight:600}
img.qi{display:block;margin:6px auto;max-width:240px;width:100%;border-radius:10px;border:1px solid var(--bd);background:#fff}
.qsvg{text-align:center;color:var(--tx)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;gap:10px;justify-content:center;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px;cursor:pointer;font:inherit;min-height:74px}
.mi img{height:56px;border-radius:6px;background:#fff}
.mi.sel{border-color:var(--pr);background:var(--prl)}
.mi.ok{border-color:var(--ok);background:var(--okb);cursor:default}
.mi.bad{border-color:var(--no);background:var(--nob)}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.tw{overflow-x:auto}
select,input[type=text],textarea{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
textarea{width:100%;min-height:110px}
.sel4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0}
.sel4 label{font-size:.8rem;color:var(--mu);display:block}
.sel4 select{width:100%}
.res{margin-top:10px;padding:12px;border-radius:12px;background:var(--prl);text-align:center}
.res b{font-size:1.6rem;display:block}
svg.rs{display:block;margin:6px auto;max-width:100%}
.seq{list-style:none;margin:0;padding:0}
.seq li{display:flex;gap:8px;align-items:center;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px 10px;margin:6px 0;cursor:grab}
.seq li.ok{border-color:var(--ok);background:var(--okb)}.seq li.no{border-color:var(--no);background:var(--nob)}
.seq li.over{border-style:dashed;border-color:var(--pr)}
.seq .n{font-weight:700;color:var(--mu);min-width:1.4em}
.seq .t{flex:1}
.seq button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;width:34px;height:34px;cursor:pointer}
.kw li{margin:4px 0;list-style:none}
.kw ul{padding:0;margin:8px 0}
.kw .f{color:var(--ok)}.kw .m{color:var(--no)}
.fc{perspective:900px;margin:8px auto;max-width:420px}
.fci{position:relative;min-height:250px;cursor:pointer;transition:transform .5s;transform-style:preserve-3d}
.fci.flip{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--bd);border-radius:16px;background:var(--card);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto}
.fcb{transform:rotateY(180deg);background:var(--prl);justify-content:flex-start;text-align:left;align-items:stretch}
.fcf img{max-height:170px;max-width:100%;border-radius:8px;background:#fff}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:2px solid var(--bd);border-radius:12px;padding:10px;min-height:70px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;text-align:center}
.tile.on{background:var(--prl);border-color:var(--pr);font-size:.82rem;text-align:left}
.ocards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ocards .card{margin:0;cursor:pointer}
.ocards .card:hover{border-color:var(--pr)}
.tcard{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;border-top:1px solid var(--bd);padding:8px 0}
.tcard img{width:90px;border-radius:8px;background:#fff}
.num{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.num input{width:130px}
.tag{font-size:.78rem;padding:1px 8px;border-radius:12px;background:var(--wnb);color:var(--wn)}
</style>
</head>

<h3>Cross filing</h3><p>The file is pushed <b>across</b> the edge. It is the first filing stage and removes most of the waste. Use a smooth-cut file on acrylic.</p>

<ol><li><b>Clamp</b> the acrylic in the vice with the edge to be filed just above the jaws. Use a filing block or jaw protectors so the surface is not marked.</li><li>Stand side-on to the vice with your feet apart and the work at about elbow height.</li><li>Hold the <b>handle</b> in one hand and the <b>tip</b> of the file in the other.</li><li>Place the file flat on the edge. Push it <b>forwards and across</b> the edge with steady pressure.</li><li><b>Lift the file off</b> on the return stroke. File in one direction only, because dragging it back can chip or scratch the acrylic.</li><li>Repeat with long, even strokes, moving along the edge, until the saw marks have gone and the edge is square. Check it against the line.</li></ol>
<h3>Draw filing</h3><p>The file is turned through 90° and moved <b>along</b> the edge. It removes the cross-filing marks and leaves a smooth, square edge. Use light pressure.</p>
<div style="text-align:center">${DRAW}</div><p class="hint">Diagram, top view: 1 and 2 = hands holding the two ends of the blade. The arrows show the file moving sideways along the length of the edge.</p>
<ol><li>Keep the acrylic <b>clamped</b> in the vice with the filing block, so that it cannot wobble.</li><li><b>Turn the file 90°</b> so it lies across the edge, and hold the blade with a hand on each side of the work.</li><li>Keep the file <b>flat</b> against the edge, with light, even pressure.</li><li><b>Push and pull</b> the file smoothly along the length of the edge. The teeth cut on both strokes.</li><li>Finish with a few light strokes, then check that the edge is smooth and square.</li></ol>
<p class="hint">Note: draw filing is hard on files, so keep it for finishing only and use light pressure.</p>
<h3>Then smooth and polish</h3><ul><li>Rub the edge with <b>wet and dry paper</b> and water, from coarse to fine grades.</li><li><b>Polish</b> on the buffing wheel with polishing compound. Peel off the protective film last.</li></ul>
<h3>Safety</h3><ul><li>Wear goggles, tie back hair and keep your fingers clear of the buffing wheel.</li><li>Hold the work firmly and polish on the lower half of the wheel.</li><li>Do not press too hard. Too much heat will melt or scorch the acrylic.</li><li>Keep your hands clear of the end of the file and the jaws of the vice.</li></ul>`));
